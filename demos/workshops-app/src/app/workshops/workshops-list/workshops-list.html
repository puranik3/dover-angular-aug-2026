<!--
    Handling successful fetch of workshops - Show the workshops
-->
<button (click)="refresh()">Click to refresh</button>

@if(loading) {
    <app-loading-spinner></app-loading-spinner>
} @else if( !loading && error ) {
    <app-error-alert [err]="error"></app-error-alert>
} @else {
    <div>
        <h1> List of workshops</h1>

        <p> Number of workshops = {{ workshops.length }}</p>

        <div class="row">
            @for( workshop of workshops; track workshop.id ) {
                <div class="col col-12 col-md-4 my-3 d-flex">
                    <app-item [workshop]="workshop"></app-item>
                </div>
            }
        </div>
    </div>
}
