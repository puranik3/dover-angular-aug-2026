<!--
    Handling successful fetch of workshops - Show the workshops
-->
<button (click)="refresh()">Click to refresh</button>

@if(loading) {
    <app-loading-spinner></app-loading-spinner>
} @else if( !loading && error ) {
    <app-error-alert [err]="error"></app-error-alert>
} @else {
    <div>
        <h1> List of workshops</h1>

        <p> Number of workshops = {{ workshops.length }}</p>

        <div class="my-2">
            <app-pagination [page]="page" (pageChange)="changePage($event)"></app-pagination>
        </div>

        <input
            type="search"
            class="form-control"
            placeholder="Type to search by name"
            [(ngModel)]="filterKey"
            (input)="filterWorkshops()"
        />

        @if ( filterKey !== '' ) {
            <div>
                Workshops whose name has
                <span class="text-primary">{{ filterKey }}</span> are shown.
            </div>
        }

        <div class="row">
            @for( workshop of filteredWorkshops; track workshop.id ) {
                <div class="col col-12 col-md-4 my-3 d-flex">
                    <app-item [workshop]="workshop"></app-item>
                </div>
            }
        </div>
    </div>
}
